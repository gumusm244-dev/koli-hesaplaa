<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavukçu Halis - Koli Barkod & Ağırlık Takip</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d90429">
    <style>
        :root {
            --primary: #d90429;
            --primary-dark: #ef233c;
            --secondary: #2b2d42;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2b2d42;
            --border: #e9ecef;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 40px;
        }

        .header {
            background: linear-gradient(135deg, #d90429, #8d99ae);
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(217, 4, 41, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border);
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #edf2f4;
            color: var(--secondary);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--secondary);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn:active {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--secondary);
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
        }

        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f3f5;
            font-weight: 600;
        }

        .total-box {
            background: #e8f5e9;
            border: 1px solid #c8e6c9;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-weight: bold;
            color: #2e7d32;
        }
    </style>
</head>
<body>

    <!-- 3 Saniyelik Açılış Ekranı (Splash Screen) -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; transition: opacity 0.5s ease;">
      <img src="logo.jpg" alt="Halis Et Logo" style="width: 220px; height: auto; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <p style="color: white; margin-top: 20px; font-family: sans-serif; font-size: 18px; font-weight: bold;">Tavukçu Halis</p>
    </div>

    <div class="header">
        <div>
            <h1>Tavukçu Halis</h1>
            <p>Koli Barkod & Ağırlık Takip Sistemi</p>
        </div>
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('scan')">Barkod Tara</button>
        <button class="tab-btn" onclick="switchTab('manual')">Manuel Ekle</button>
        <button class="tab-btn" onclick="switchTab('list')">Koli Listesi</button>
    </div>

    <div id="tab-scan" class="card">
        <div id="reader"></div>
        <div class="input-group">
            <label>Son Okunan Barkod / Ağırlık</label>
            <input type="text" id="scan-result" readonly placeholder="Barkod bekleniyor...">
        </div>
    </div>

    <div id="tab-manual" class="card" style="display: none;">
        <div class="input-group">
            <label>Ürün Adı / Koli Tipi</label>
            <input type="text" id="manual-name" placeholder="Örn: Bütün Tavuk">
        </div>
        <div class="input-group">
            <label>Ağırlık (KG)</label>
            <input type="number" step="0.01" id="manual-weight" placeholder="Örn: 12.45">
        </div>
        <button class="btn" onclick="addManual()">Listeye Ekle</button>
    </div>

    <div id="tab-list" class="card" style="display: none;">
        <h3>Okutulan Koliler</h3>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Detay</th>
                    <th>KG</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="koli-table-body">
            </tbody>
        </table>
        <div class="total-box">
            Toplu Ağırlık: <span id="total-weight">0.00</span> KG
        </div>
        <br>
        <button class="btn btn-secondary" onclick="clearList()">Listeyi Temizle</button>
    </div>

    <script>
        // Açılış Ekranını Kapatma
        setTimeout(function() {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 500);
            }
        }, 3000);

        let koliList = [];
        let html5QrcodeScanner = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-scan').style.display = 'none';
            document.getElementById('tab-manual').style.display = 'none';
            document.getElementById('tab-list').style.display = 'none';

            if (tabName === 'scan') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-scan').style.display = 'block';
                startScanner();
            } else if (tabName === 'manual') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-manual').style.display = 'block';
                stopScanner();
            } else if (tabName === 'list') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('tab-list').style.display = 'block';
                stopScanner();
                updateTable();
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('scan-result').value = decodedText;
            let weight = extractWeight(decodedText);
            
            koliList.push({
                code: decodedText,
                weight: weight || 0,
                time: new Date().toLocaleTimeString('tr-TR')
            });

            alert(`Koli Eklendi! Ağırlık: ${weight || 'Tespit Edilemedi'} KG`);
        }

        function extractWeight(text) {
            let matches = text.match(/(\d+[.,]\d+)/);
            if (matches) {
                return parseFloat(matches[0].replace(',', '.'));
            }
            return null;
        }

        function startScanner() {
            try {
                if (!html5QrcodeScanner && typeof Html5QrcodeScanner !== 'undefined') {
                    html5QrcodeScanner = new Html5QrcodeScanner(
                        "reader", { fps: 10, qrbox: 250 }
                    );
                    html5QrcodeScanner.render(onScanSuccess);
                }
            } catch (e) {
                console.log("Kamera hatası:", e);
            }
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().catch(error => console.error(error));
                html5QrcodeScanner = null;
            }
        }

        function addManual() {
            let name = document.getElementById('manual-name').value;
            let weight = parseFloat(document.getElementById('manual-weight').value);

            if (!weight) {
                alert('Lütfen geçerli bir ağırlık girin.');
                return;
            }

            koliList.push({
                code: name || 'Manuel Koli',
                weight: weight,
                time: new Date().toLocaleTimeString('tr-TR')
            });

            document.getElementById('manual-name').value = '';
            document.getElementById('manual-weight').value = '';
            alert('Koli eklendi!');
        }

        function updateTable() {
            let tbody = document.getElementById('koli-table-body');
            tbody.innerHTML = '';
            let total = 0;

            koliList.forEach((item, index) => {
                total += item.weight;
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.code}<br><small style="color:#6c757d">${item.time}</small></td>
                    <td><b>${item.weight.toFixed(2)}</b></td>
                    <td><button onclick="deleteItem(${index})" style="background:#d90429;color:white;border:none;padding:4px 8px;border-radius:4px;">Sil</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-weight').innerText = total.toFixed(2);
        }

        function deleteItem(index) {
            koliList.splice(index, 1);
            updateTable();
        }

        function clearList() {
            if (confirm('Tüm listeyi silmek istediğinize emin misiniz?')) {
                koliList = [];
                updateTable();
            }
        }

        window.onload = () => {
            startScanner();
        };
    </script>
</body>
</html>
