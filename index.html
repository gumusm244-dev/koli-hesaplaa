<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tavukçu Halis - Koli Barkod & Ağırlık Takip</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d90429">
</head>
<body>

    <!-- 3 Saniyelik Açılış Ekranı (Splash Screen) -->
    <div id="splash-screen" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease;">
      <img src="logo.jpg" alt="Halis Et Logo" style="width: 220px; height: auto; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <p style="color: white; margin-top: 20px; font-family: sans-serif; font-size: 18px; font-weight: bold;">Tavukçu Halis</p>
    </div>

    <!-- Orijinal Uygulama İçeriğin -->
    <script>
        // 3 saniye sonra logo kapanır
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(() => splash.style.display = 'none', 500);
                }
            }, 3000);
        });
    </script>

</body>
</html>
